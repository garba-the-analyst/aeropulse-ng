[package]
name = "aeropulse-ng"
version = "2.4.0"
description = "AeroPulse-NG Tactical Radar & Airspace Surveillance Engine"
authors = ["Garba"]
edition = "2021"
rust-version = "1.78"
default-run = "aeropulse-ng"

[features]
default = ["tauri-host"]
tauri-host = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
# Online-only OSINT fetcher (OpenSky). Off by default to preserve the
# air-gap contract — NDAiE builds must use --no-default-features or
# default features WITHOUT osint-live.
osint-live = ["dep:reqwest"]

[build-dependencies]
tauri-build = { version = "^2.0", optional = true, features = [] }

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "^2.0", optional = true, features = [] }
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.16"
rand = "0.9.4"
csv = "1.3"
flate2 = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
